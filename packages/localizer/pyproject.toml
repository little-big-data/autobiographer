[project]
name = "localizer"
version = "0.1.0"
description = "Data-sovereignty layer: fetch, normalize, and store personal life data."
requires-python = ">=3.9"
dependencies = [
    "duckdb>=0.10",
    "pandas>=2.0",
    "requests>=2.31",
    "click>=8.1",
    "rich>=13.0",
    "feedparser>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
playwright = ["playwright>=1.44"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "responses>=0.25",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
localizer = "localizer.cli:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
